# 校园场地预约系统 - Nginx 配置示例
# 部署到 120.26.124.180 时使用
# 将本配置合并到站点配置中，或作为参考

server {
    listen 80;
    server_name 120.26.124.180;
    root /www/wwwroot/120.26.124.180;
    index index.html;

    # 重要：上传文件必须代理到后端，否则图片显示破损、点击会打开主页
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
